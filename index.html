<!doctype html>
<html lang="en">
  <head>
    <script>try{const p=localStorage.getItem("tibia-buddy-theme");const dark=p==="dark"||((!p||p==="system")&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=dark?"dark":"light";document.documentElement.style.colorScheme=dark?"dark":"light"}catch{}</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18251f" />
    <meta name="description" content="Your Tibia companion. Track hunts, organise supplies, plan training and explore the world." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Tibia Buddy</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
